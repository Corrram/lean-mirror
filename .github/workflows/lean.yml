name: LeanMirror
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reader and source-integrity tests
        run: |
          npm test
          python -m unittest discover -s tests
      - name: Check generated companions
        run: |
          python scripts/classical.py --check
          python scripts/mirror.py check examples/analysis
          python scripts/source.py check examples/source
      - name: Build the offline reader
        run: python scripts/mirror.py build examples/analysis
      - uses: actions/upload-artifact@v6
        with:
          name: analysis-companion
          path: build/analysis
      - name: Preserve dependency pins and generated sources
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json examples
